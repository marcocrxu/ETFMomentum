<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETF 动量轮动策略回测</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css', v='20260823') }}">
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <h1>📊 ETF 动量轮动策略回测</h1>
      <p class="subtitle">基于动量轮动的 ETF 量化策略可视化回测平台</p>
    </header>

    <nav class="page-nav">
      <a href="/" class="active">📊 回测</a>
      <a href="/analysis">🔬 策略分析</a>
      <a href="/yanyan">🛡️ yanyan</a>
      <a href="/leaderboard">🏆 打榜</a>
    </nav>

    <section class="card params-card">
      <div class="card-header">
        <h2>⚙️ 策略参数</h2>
        <div class="header-actions">
          <button type="button" class="btn btn-secondary" id="btn-import">📂 导入配置</button>
          <button type="button" class="btn btn-secondary" id="btn-export">📋 导出配置</button>
        </div>
      </div>

      <div class="param-grid">
        <div class="param-group" style="grid-column: 1 / -1;">
          <label class="group-label">标的池</label>
          <div class="etf-chips" id="etf-chips">
            <!-- chips injected by JS -->
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">上证空仓</label>
          <select id="sh_cash">
            <option value="1">开启</option>
            <option value="2">仅A股(豁免纳指黄金)</option>
            <option value="0">关闭</option>
          </select>
        </div>

        <div class="param-group">
          <label class="group-label">空仓冷却天</label>
          <input id="sh_cash_cooldown" type="number" value="3" min="0" max="60">
        </div>

        <div class="param-group">
          <label class="group-label" title="入场乖离门: 候选现价高于其20日均线超过X%时不买 (0=关闭; 研究候选5.0, 躲深亏追高腿)">入场乖离门%</label>
          <input id="entry_bias_cap" type="number" value="0" min="0" step="0.5">
        </div>

        <div class="param-group">
          <label class="group-label" title="1=Top-1全仓(原策略); 2/3=持有动量最强的K只并每日等权再平衡">持仓数 Top-K</label>
          <select id="top_k">
            <option value="1" selected>1 (全仓)</option>
            <option value="2">2 等权</option>
            <option value="3">3 等权</option>
          </select>
        </div>

        <div class="param-group">
          <label class="group-label" title="排名动量跳过最近N天以规避短期反转, 0=关闭">动量跳过天</label>
          <input id="mom_skip" type="number" value="0" min="0" max="10">
        </div>

        <div class="param-group">
          <label class="group-label" title="VIX>此值时禁止新买/切换纳指 (美股恐慌保护, 0=关闭)">VIX恐慌门</label>
          <input id="vix_gate" type="number" value="0" min="0" step="1">
        </div>

        <div class="param-group">
          <label class="group-label" title="SKEW>此值时禁止新买/切换纳指 (尾部风险, 0=关闭, 研究建议150)">SKEW尾部风险门</label>
          <input id="skew_gate" type="number" value="0" min="0" step="5">
        </div>

        <div class="param-group">
          <label class="group-label" title="纳指动量混入 QQQ×USDCNY 人民币口径动量: (1-w)×513100 + w×QQQ-CNY; w=QQQ权重(0.7=70%QQQ+30%ETF), 默认开 (2026-08-18 决议, 平台[0.6,0.75])">纳指动量混合QQQ</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="nz_mom_qqq_on" checked>
              <span class="track"></span>
            </label>
            <input id="nz_mom_qqq_w" type="number" value="0.7" min="0" max="1" step="0.05" style="width: 64px">
          </div>
        </div>

        <div class="param-group">
          <label class="group-label" title="动量周期 mp-1/mp/mp+1/mp+2 四周期等权集成, 不押单一窗口">山脊集成</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="ridge_on">
              <span class="track"></span>
            </label>
          </div>
        </div>

        <div class="param-group">
          <label class="group-label" title="ratio=价格比(price[t]/price[t-w]); ols=回归斜率(与生产cron同口径)">动量口径</label>
          <select id="mom_type">
            <option value="ratio" selected>价格比</option>
            <option value="ols">OLS斜率</option>
          </select>
        </div>

        <div class="param-group">
          <label class="group-label" title="持仓仍是动量第一且亏损达止损线时直接清到空仓(补止损盲区)">绝对止损</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="abs_stop_on" checked>
              <span class="track"></span>
            </label>
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">绝对动量门</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="abs_mom_on">
              <span class="track"></span>
            </label>
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">防御切换</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="defensive_on">
              <span class="track"></span>
            </label>
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">风险调整动量</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="risk_adj_on">
              <span class="track"></span>
            </label>
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">多周期动量</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="multi_mom_on">
              <span class="track"></span>
            </label>
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">FIP动量质量</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="fip_on">
              <span class="track"></span>
            </label>
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">校准方法</label>
          <select id="method">
            <option value="sigma">Sigma</option>
            <option value="percentile">分位数</option>
            <option value="ewma_z">EWMA Z</option>
          </select>
        </div>

        <div class="param-group">
          <label class="group-label">动量周期</label>
          <select id="mom_period">
            <option value="5">5日</option>
            <option value="10">10日</option>
            <option value="20" selected>20日</option>
            <option value="30">30日</option>
            <option value="-1">自定义</option>
          </select>
          <input id="mom_period_custom" type="number" placeholder="<30" min="1" style="display:none;margin-top:6px">
        </div>

        <div class="param-group">
          <label class="group-label">加速止盈 σ</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="accel_on" checked>
              <span class="track"></span>
            </label>
            <input id="accel_sigma" type="number" step="0.5" value="3.0">
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">止盈冷却天</label>
          <input id="accel_cooldown" type="number" value="3" min="0" max="60">
        </div>

        <div class="param-group">
          <label class="group-label" title="止盈冷却仅对黄金生效 (创业的止盈后买回历史上是正收益, 不误伤; I-15)">仅黄金冷却</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="accel_cooldown_gold_only" checked>
              <span class="track"></span>
            </label>
          </div>
        </div>

        <div class="param-group">
          <label class="group-label" title="止损/绝对止损后N天内禁止买回同一标的 (0=关闭, 恐慌抄底豁免)">止损冷却天</label>
          <input id="stop_cooldown" type="number" value="0" min="0" max="60">
        </div>

        <div class="param-group">
          <label class="group-label">恐慌抄底 σ</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="crash_on" checked>
              <span class="track"></span>
            </label>
            <input id="crash_sigma" type="number" step="0.5" value="-2.5">
          </div>
        </div>

        <div class="param-group">
          <label class="group-label">抄底锁仓天</label>
          <input id="crash_lock" type="number" value="7" min="0">
        </div>

        <div class="param-group">
          <label class="group-label" title="恐慌抄底时已持其他标的的切换比例(0-100)。空仓时强制100%。已持创业不重复抄底">抄底仓位 %</label>
          <input id="crash_alloc" type="number" value="100" min="0" max="100" step="5">
        </div>

        <div class="param-group">
          <label class="group-label">最短持有天</label>
          <input id="min_hold" type="number" value="10" min="1">
        </div>

        <div class="param-group">
          <label class="group-label">最小动量差 %</label>
          <input id="min_gap" type="number" step="0.5" value="1.0">
        </div>

        <div class="param-group">
          <label class="group-label" title="仅当存在动量更强的候选标的时检查；持仓仍是动量第一名时不触发，实际亏损可能超过此线">止损线 % ⓘ</label>
          <input id="stop_loss" type="number" step="1" value="-5.0">
        </div>

        <div class="param-group">
          <label class="group-label">例外动量差 %</label>
          <input id="exception_gap" type="number" step="0.5" value="3.0">
        </div>

        <div class="param-group">
          <label class="group-label">确认天数</label>
          <input id="confirm_days" type="number" value="2" min="1">
        </div>

        <div class="param-group">
          <label class="group-label">起始日期</label>
          <input id="start_date" type="date" value="2016-07-10">
        </div>

        <div class="param-group">
          <label class="group-label">结束日期</label>
          <input id="end_date" type="date" value="2026-07-28">
        </div>

        <div class="param-group">
          <label class="group-label">手续费 %</label>
          <input id="commission" type="number" step="0.005" value="0.01">
        </div>

        <div class="param-group">
          <label class="group-label">滑点 %</label>
          <input id="slippage" type="number" step="0.01" value="0.0" min="0">
        </div>

        <div class="param-group date-shortcuts">
          <label class="group-label">快捷日期</label>
          <div class="shortcut-btns">
            <button type="button" class="btn btn-small" data-days="30">30天</button>
            <button type="button" class="btn btn-small" data-days="60">60天</button>
            <button type="button" class="btn btn-small" data-days="365">1年</button>
            <button type="button" class="btn btn-small" data-days="1095">3年</button>
            <button type="button" class="btn btn-small" data-days="1825">5年</button>
          </div>
        </div>
      </div>

      <div class="param-actions">
        <button type="button" class="btn btn-primary" id="btn-run">🚀 运行回测</button>
      </div>

      <div class="error-banner" id="error-banner" style="display:none"></div>
    </section>

    <section class="kpi-grid" id="kpi-grid" style="display:none">
      <div class="kpi"><div class="kpi-value" id="kpi-total">--</div><div class="kpi-label">累计收益</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-ann">--</div><div class="kpi-label">年化收益</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-dd">--</div><div class="kpi-label">最大回撤</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-calmar">--</div><div class="kpi-label">Calmar</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-sharpe">--</div><div class="kpi-label">夏普比率</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-vol">--</div><div class="kpi-label">年化波动</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-trades">--</div><div class="kpi-label">交易笔数</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-neg">--</div><div class="kpi-label">亏损年</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-pos" style="font-size:14px">--</div><div class="kpi-label">最后持仓</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-range" style="font-size:11px">--</div><div class="kpi-label">数据范围</div></div>
    </section>

    <div class="charts-toolbar" id="charts-toolbar" style="display:none">
      <label class="link-toggle">
        <input type="checkbox" id="link-zoom" checked>
        <span>🔗 四图联动缩放</span>
      </label>
      <span class="toolbar-hint">勾选后，任一图表的缩放/平移会同步到全部四张图</span>
    </div>

    <section class="charts-grid" id="charts-grid" style="display:none">
      <div class="card chart-card">
        <div class="card-header"><h2>📈 净值曲线</h2></div>
        <div class="chart" id="nav-chart"></div>
      </div>
      <div class="card chart-card">
        <div class="card-header"><h2>📉 回撤曲线</h2></div>
        <div class="chart" id="drawdown-chart"></div>
      </div>
      <div class="card chart-card">
        <div class="card-header"><h2 id="yearly-title">📅 年度收益</h2></div>
        <div class="chart" id="yearly-chart"></div>
      </div>
      <div class="card chart-card">
        <div class="card-header"><h2>🔄 持仓轮动</h2></div>
        <div class="chart" id="position-chart"></div>
      </div>
    </section>

    <section class="card table-card" id="table-card" style="display:none">
      <div class="card-header"><h2>📋 决策记录 <span id="trades-count" style="font-size:12px;color:#8b92a8;font-weight:400"></span> <span style="font-size:12px;color:#8b92a8;font-weight:400">点击列头排序 · 再点切换升/降序</span></h2></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>序号</th>
              <th data-sort="date" class="th-sort">日期 <span class="sort-ind">↕</span></th>
              <th data-sort="action" class="th-sort">决策 <span class="sort-ind">↕</span></th>
              <th data-sort="price" class="th-sort">成交价 <span class="sort-ind">↕</span></th>
              <th data-sort="pnl" class="th-sort">收益 <span class="sort-ind">↕</span></th>
              <th data-sort="nav" class="th-sort">净值 <span class="sort-ind">↕</span></th>
              <th data-sort="days" class="th-sort">持有天 <span class="sort-ind">↕</span></th>
              <th data-sort="reason" class="th-sort">原因 <span class="sort-ind">↕</span></th>
            </tr>
          </thead>
          <tbody id="trades-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="loading-overlay" id="loading" style="display:none">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loading-text">回测计算中...</p>
    </div>
  </div>

  <input type="file" id="import-input" accept="application/json" style="display:none">

  <script src="{{ url_for('static', filename='lib/echarts.min.js', v='20260821') }}"></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js', v='20260823') }}"></script>
</body>
</html>
