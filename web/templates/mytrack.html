<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>实盘对账</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  <style>
    .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat-card { flex: 1; min-width: 130px; background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 14px; }
    .stat-card .k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .stat-card .v { font-size: 20px; font-weight: 700; color: var(--text); }
    .stat-card .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .pos { color: var(--green) !important; } .neg { color: var(--red) !important; }
    .mytag { color: var(--accent); } .sttag { color: #64b5f6; }
    .form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0; }
    .form-row input, .form-row select { background: var(--surface-3); border: 1px solid var(--border);
      color: var(--text); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--accent); }
    .hint { font-size: 12px; color: var(--muted); line-height: 1.7; }
    #save-msg { font-size: 13px; margin-left: 10px; }
    .open-box { background: rgba(233,69,96,.08); border: 1px solid rgba(233,69,96,.3);
      border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; font-size: 13px; color: var(--text); }
    .del-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; }
    .del-btn:hover { color: var(--red); }
  </style>
</head>
<body>
<div class="page-wrapper">
  <div class="card">
    <div class="card-header"><h2>📒 我的实盘对账 <span style="font-size:12px;color:var(--muted);font-weight:400">（此页面为私密页，请勿分享链接）</span></h2></div>
    <div style="padding:18px" id="app">
      <p class="hint">记账规则：支持分批多标的。每条记录=日期+买/卖+标的+实际成交价+<b>仓位%</b>（可空=100）。买入% = 动用当前可用现金的比例；卖出% = 卖出该标的持仓的比例。同一天先卖后买都记上、顺序不限。买入价→当日收盘、昨收→卖出价的损益如实计入。</p>
      <div id="main"></div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='lib/echarts.min.js', v='20260821') }}"></script>
<script>
var DATA = {{ data | tojson }};
var KEY = {{ key | tojson }};
var records = (DATA.records || []).slice();
var chartInst = null;   // 净值图实例（实时刷新尾部点位用）

function fmtPct(v, digits){ if (v === null || v === undefined) return '—';
  var s = v.toFixed(digits === undefined ? 2 : digits) + '%';
  return '<span class="' + (v > 0 ? 'pos' : (v < 0 ? 'neg' : '')) + '">' + (v > 0 ? '+' : '') + s + '</span>'; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

// ── 汇总 + 图表 + 逐笔 ──
function renderMain(){
  var html = '';
  if (!DATA.empty && DATA.mine){
    var m = DATA.mine, st = DATA.strat;
    if (DATA.open_pos && DATA.open_pos.length){
      html += '<div class="open-box" id="open-pos-box">📌 当前持仓：' + DATA.open_pos.map(function(o){
        return '<b>' + esc(o.asset) + '</b>（成本 ' + o.avg_cost + ' · 仓位 ' + o.weight + '% · 浮盈 ' + fmtPct(o.float_ret) + '）';
      }).join('　') + '</div>';
    }
    html += '<div class="stat-row">'
      + statMine(m)
      + stat('策略同期', st ? fmtPct(st.total_ret) : '—', st ? ('年化 ' + (st.ann > 0 ? '+' : '') + st.ann + '% · 回撤 ' + st.mdd + '%') : '策略回测不可用', 'sttag')
      + stat('我 - 策略', st ? fmtPct(m.total_ret - st.total_ret) : '—', '正=跑赢', '')
      + stat('闭合交易', m.n_trades + ' 笔', '胜率 ' + (m.win_rate === null ? '—' : m.win_rate + '%'), '')
      + (DATA.benchmarks || []).map(function(b){
          return stat(b.name + '同期', fmtPct(b.total_ret),
            '我' + fmtPct(m.total_ret - b.total_ret) + ' · 回撤 ' + b.mdd + '%', '');
        }).join('')
      + (DATA.combos || []).map(function(c){
          return stat(c.name + '组合', fmtPct(c.total_ret),
            '我' + fmtPct(m.total_ret - c.total_ret) + ' · 回撤 ' + c.mdd + '%', '');
        }).join('')
      + '</div>';
    html += '<div id="nav-chart" style="width:100%;height:360px"></div>';
    if (DATA.benchmarks && DATA.benchmarks.length){
      html += '<p class="hint">指数同期 = 该指数从我首笔买入日 rebase 到 1，与我的实盘同窗口对比。图中"我的实盘 / 策略(实时) / 上证指数 / 创业板指数"的最后一个点均为分钟级实时（盘中每 60 秒随现价刷新）；其余曲线在图例里点开。</p>';
    }
    html += comboPanelHtml();
    if (DATA.trades && DATA.trades.length){
      html += '<h3 style="color:var(--accent);font-size:15px;margin:18px 0 10px">逐笔对账</h3><table><thead><tr>'
        + '<th>标的</th><th>买入日</th><th>买价</th><th>卖出日</th><th>卖价</th>'
        + '<th>我的收益</th><th>同期策略</th><th>差值</th><th>买点偏差</th><th>卖点偏差</th><th>备注</th></tr></thead><tbody>';
      DATA.trades.forEach(function(t){
        var diff = (t.strat_ret === null || t.strat_ret === undefined) ? null : t.ret - t.strat_ret;
        html += '<tr><td>' + esc(t.asset) + '</td><td>' + t.entry_date + '</td><td>' + t.entry_price + '</td>'
          + '<td>' + t.exit_date + '</td><td>' + t.exit_price + '</td>'
          + '<td>' + fmtPct(t.ret) + '</td><td>' + fmtPct(t.strat_ret) + '</td><td>' + fmtPct(diff) + '</td>'
          + '<td>' + fmtPct(t.entry_dev, 1) + '</td><td>' + fmtPct(t.exit_dev, 1) + '</td>'
          + '<td>' + esc(t.note) + '</td></tr>';
      });
      html += '</tbody></table><p class="hint">买/卖点偏差 = 实际成交价相对当日收盘的偏离；正数=买贵/卖贵了，负数=买便宜了。同期策略 = 策略净值在我买入日→卖出日之间的涨幅。</p>';
    }
  }
  // ── 记录管理 ──
  html += '<h3 style="color:var(--accent);font-size:15px;margin:22px 0 10px">买卖记录（' + records.length + ' 条）</h3>';
  html += '<div class="form-row">'
    + '<input type="date" id="f-date">'
    + '<select id="f-action"><option value="buy">买入</option><option value="sell">卖出</option></select>'
    + '<select id="f-asset">' + (DATA.assets || []).map(function(a){ return '<option>' + a + '</option>'; }).join('') + '</select>'
    + '<input type="number" id="f-price" step="0.001" min="0" placeholder="成交价" style="width:100px">'
    + '<input type="number" id="f-amount" step="0.01" min="0" placeholder="成交额(可选)" style="width:120px">'
    + '<input type="number" id="f-pct" step="1" min="1" max="100" placeholder="仓位%(可选)" style="width:110px">'
    + '<input type="text" id="f-note" placeholder="备注(可选)" style="width:140px">'
    + '<button class="btn btn-primary btn-small" id="add-btn">添加</button>'
    + '<button class="btn btn-secondary btn-small" id="save-btn">💾 保存全部</button>'
    + '<span id="save-msg"></span></div>'
    + '<p class="hint">成交额和仓位%填一个就行，都空=全仓（买入用光现金/卖出清该标的）。填了成交额就按成交额精确记账。</p>';
  html += '<table><thead><tr><th>#</th><th>日期</th><th>动作</th><th>标的</th><th>价格</th><th>成交额</th><th>仓位%</th><th>备注</th><th></th></tr></thead><tbody>';
  records.forEach(function(r, i){
    html += '<tr><td>' + (i + 1) + '</td><td>' + r.date + '</td>'
      + '<td>' + (r.action === 'buy' ? '<span class="pos">买入</span>' : '<span class="neg">卖出</span>') + '</td>'
      + '<td>' + esc(r.asset || '') + '</td><td>' + r.price + '</td>'
      + '<td>' + (r.amount ? Number(r.amount).toFixed(1) : '') + '</td>'
      + '<td>' + (r.pct !== undefined && r.pct !== null && r.pct !== 100 ? r.pct : '') + '</td>'
      + '<td>' + esc(r.note || '') + '</td>'
      + '<td><button class="del-btn" data-i="' + i + '">✕ 删除</button></td></tr>';
  });
  html += '</tbody></table>';
  document.getElementById('main').innerHTML = html;
  wireCombos();

  document.getElementById('add-btn').onclick = function(){
    var r = { date: document.getElementById('f-date').value,
              action: document.getElementById('f-action').value,
              asset: document.getElementById('f-asset').value,
              price: parseFloat(document.getElementById('f-price').value),
              note: document.getElementById('f-note').value };
    var amt = parseFloat(document.getElementById('f-amount').value);
    var pct = parseFloat(document.getElementById('f-pct').value);
    if (amt > 0) r.amount = amt;
    if (pct > 0 && pct <= 100) r.pct = pct;
    if (!r.date || !r.price || r.price <= 0){ msg('日期和价格必填', 'var(--red)'); return; }
    records.push(r);
    records.sort(function(a, b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    msg('已添加（记得点保存）', 'var(--green)'); renderMain();
  };
  Array.prototype.forEach.call(document.querySelectorAll('.del-btn'), function(b){
    b.onclick = function(){ records.splice(parseInt(b.dataset.i), 1);
      msg('已删除（记得点保存）', 'var(--green)'); renderMain(); };
  });
  document.getElementById('save-btn').onclick = function(){
    msg('保存中…', 'var(--muted)');
    fetch('/mytrack/' + KEY + '/save', { method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({records: records})
    }).then(function(r){ return r.json().then(function(j){ return {ok: r.ok, j: j}; }); })
    .then(function(res){
      if (res.ok && res.j.success){ msg('✅ 已保存，刷新中…', 'var(--green)'); setTimeout(function(){ location.reload(); }, 600); }
      else msg('❌ ' + (res.j.error || '保存失败'), 'var(--red)');
    }).catch(function(e){ msg('❌ 网络错误: ' + e, 'var(--red)'); });
  };

  if (!DATA.empty && DATA.mine) drawChart();
}
// ── 策略组合对比面板（标的池/参数可调，保存后重算画图）──
var comboDefs = (DATA.combo_defs || []).map(function(c){
  return { name: c.name, universe: (c.universe || []).slice(),
           params: JSON.parse(JSON.stringify(c.params || {})) };
});
function comboPanelHtml(){
  var assets = DATA.assets || [];
  var html = '<h3 style="color:var(--accent);font-size:15px;margin:18px 0 10px">策略组合对比（标的池/参数可调，保存后重算画图）</h3>';
  html += '<div id="combo-list">';
  comboDefs.forEach(function(c, i){
    html += '<div class="combo-item" style="border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px">'
      + '<div class="form-row">'
      + '<input type="text" class="c-name" value="' + esc(c.name) + '" style="width:130px">'
      + assets.map(function(a){
          var chk = c.universe.indexOf(a) >= 0 ? ' checked' : '';
          return '<label style="font-size:12px;color:var(--muted)"><input type="checkbox" class="c-asset" data-asset="' + a + '"' + chk + '> ' + a + '</label>';
        }).join('')
      + '</div>'
      + '<div class="form-row">'
      + '<label style="font-size:12px;color:var(--muted)"><input type="checkbox" class="c-shcash"' + (c.params.sh_cash === false ? '' : ' checked') + '> 上证空仓</label>'
      + '<label style="font-size:12px;color:var(--muted)"><input type="checkbox" class="c-qqq"' + (c.params.nz_mom_qqq_on === false ? '' : ' checked') + '> QQQ混合</label>'
      + '<span style="font-size:12px;color:var(--muted)">QQQ权重</span><input type="number" class="c-qqqw" value="' + (c.params.nz_mom_qqq_w !== undefined ? c.params.nz_mom_qqq_w : 0.7) + '" min="0" max="1" step="0.05" style="width:58px">'
      + '<span style="font-size:12px;color:var(--muted)">动量周期</span><input type="number" class="c-mom" value="' + (c.params.mom_period || 20) + '" min="10" max="60" style="width:62px">'
      + '<span style="font-size:12px;color:var(--muted)">止盈冷却</span><input type="number" class="c-cd" value="' + (c.params.accel_cooldown !== undefined ? c.params.accel_cooldown : 3) + '" min="0" max="10" style="width:56px">'
      + '<button class="btn btn-secondary btn-small c-del" data-i="' + i + '">✕ 删除</button>'
      + '</div></div>';
  });
  html += '</div>';
  html += '<div class="form-row">'
    + '<button class="btn btn-secondary btn-small" id="combo-add">＋ 添加组合</button>'
    + '<button class="btn btn-primary btn-small" id="combo-save">💾 保存组合并重算</button>'
    + '<span id="combo-msg" style="font-size:13px"></span></div>';
  html += '<p class="hint">组合曲线 = 该标的池按 20 日动量轮动规则（与主策略同引擎、当前默认口径）跑出的净值，起点=我首笔买入日。参数留默认即沿用主策略口径；QQQ权重 0=纯ETF、0.7=主策略口径、1=纯QQQ（从策略）。</p>';
  return html;
}
function wireCombos(){
  var listEl = document.getElementById('combo-list');
  if (!listEl) return;
  function collect(){
    return comboDefs.map(function(c, i){
      var item = listEl.children[i];
      var uni = [];
      Array.prototype.forEach.call(item.querySelectorAll('.c-asset'), function(chk){
        if (chk.checked) uni.push(chk.dataset.asset);
      });
      var params = {};
      if (!item.querySelector('.c-shcash').checked) params.sh_cash = false;
      if (!item.querySelector('.c-qqq').checked) {
        params.nz_mom_qqq_on = false;
      } else {
        var qw = parseFloat(item.querySelector('.c-qqqw').value);
        if (!isNaN(qw) && qw !== 0.7) params.nz_mom_qqq_w = Math.min(Math.max(qw, 0), 1);
      }
      var mp = parseInt(item.querySelector('.c-mom').value, 10);
      if (mp && mp !== 20) params.mom_period = mp;
      var cd = parseInt(item.querySelector('.c-cd').value, 10);
      if (!isNaN(cd) && cd !== 3) params.accel_cooldown = cd;
      return { name: item.querySelector('.c-name').value, universe: uni, params: params };
    });
  }
  document.getElementById('combo-add').onclick = function(){
    comboDefs.push({ name: '新组合' + (comboDefs.length + 1), universe: ['纳指', '黄金', '创业'], params: {} });
    renderMain();
  };
  document.getElementById('combo-save').onclick = function(){
    var msg = document.getElementById('combo-msg');
    msg.textContent = '保存中…'; msg.style.color = 'var(--muted)';
    fetch('/mytrack/' + KEY + '/combos/save', { method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({combos: collect()})
    }).then(function(r){ return r.json().then(function(j){ return {ok: r.ok, j: j}; }); })
    .then(function(res){
      if (res.ok && res.j.success){ msg.textContent = '✅ 已保存，重算中…'; msg.style.color = 'var(--green)';
        setTimeout(function(){ location.reload(); }, 800); }
      else { msg.textContent = '❌ ' + (res.j.error || '保存失败'); msg.style.color = 'var(--red)'; }
    }).catch(function(e){ msg.textContent = '❌ 网络错误: ' + e; msg.style.color = 'var(--red)'; });
  };
  Array.prototype.forEach.call(listEl.querySelectorAll('.c-del'), function(b){
    b.onclick = function(){ comboDefs.splice(parseInt(b.dataset.i, 10), 1); renderMain(); };
  });
}
function stat(k, v, s, cls){
  return '<div class="stat-card"><div class="k">' + k + '</div><div class="v ' + cls + '">' + v + '</div><div class="s">' + s + '</div></div>';
}
function statMine(m){
  return '<div class="stat-card"><div class="k">我的总收益</div>'
    + '<div class="v mytag" id="mine-ret">' + fmtPct(m.total_ret) + '</div>'
    + '<div class="s" id="mine-ret-s">年化 ' + (m.ann > 0 ? '+' : '') + m.ann + '% · 回撤 ' + m.mdd + '%'
    + '<br>总资产 ¥<span id="mine-eq">' + Number(m.nav_yuan).toLocaleString() + '</span> · 现金 ¥' + Number(m.cash_left).toLocaleString() + '</div></div>';
}
// ── 持仓实时刷新（分钟级: 腾讯行情, 60s 轮询）──
function liveAssets(){
  var set = [];
  (DATA.open_pos || []).forEach(function(o){ if (set.indexOf(o.asset) < 0) set.push(o.asset); });
  if (DATA.strat && DATA.strat.position && set.indexOf(DATA.strat.position) < 0) set.push(DATA.strat.position);
  (DATA.combos || []).forEach(function(c){ if (c.position && set.indexOf(c.position) < 0) set.push(c.position); });
  (DATA.benchmarks || []).forEach(function(b){ if (set.indexOf(b.name) < 0) set.push(b.name); });
  ['QQQ', 'USDCNY'].forEach(function(a){ if (set.indexOf(a) < 0) set.push(a); });
  return set;
}
function computeEq(q){
  var eq = Number(DATA.mine.cash_left) || 0;
  (DATA.open_pos || []).forEach(function(o){
    var p = (q && q[o.asset] && q[o.asset].price) ? q[o.asset].price : o.last;
    eq += o.units * p;
  });
  return eq;
}
function renderOpenBox(q, eq){
  var box = document.getElementById('open-pos-box');
  if (!box) return;
  var rows = (DATA.open_pos || []).map(function(o){
    var p = (q && q[o.asset] && q[o.asset].price) ? q[o.asset].price : o.last;
    var val = o.units * p;
    return { o: o, p: p, val: val };
  });
  rows.forEach(function(r){ r.ret = r.o.cost > 0 ? (r.val / r.o.cost - 1) * 100 : 0; });
  var t0 = '';
  for (var k in q){ if (q[k].time){ t0 = q[k].time; break; } }
  box.innerHTML = '📌 当前持仓 <span style="color:var(--muted);font-weight:400">（实时 · 分钟级 · ' + (t0 || '—') + '）</span>：'
    + rows.map(function(r){
        var w = eq > 0 ? (r.val / eq * 100).toFixed(1) : '0.0';
        var v = (q.vol20 || {})[r.o.asset];
        return '<b>' + esc(r.o.asset) + '</b>（成本 ' + r.o.avg_cost + ' · 现价 ' + r.p
          + ' · 仓位 ' + w + '% · 浮盈 ' + fmtPct(r.ret)
          + ' · σ20 ' + (v ? v.vol20 + '%' : '—') + '）';
      }).join('　')
    + '　<span id="fx-line" style="color:var(--muted)"></span>'
    + '<div style="color:var(--muted);margin-top:6px;font-size:12px">σ20(日%, 括号=3σ止损线/年化)：'
    + liveAssets().map(function(a){
        var v = (q.vol20 || {})[a];
        return v ? esc(a) + ' ' + v.vol20 + '%(线' + v.stop + '%/年' + v.ann + '%)' : '';
      }).filter(Boolean).join(' · ')
    + '</div>'
    + '<div style="color:var(--muted);margin-top:2px;font-size:12px">mom10→止盈阈值(μ+3σ)：'
    + liveAssets().map(function(a){
        var v = (q.mom10 || {})[a];
        if (!v) return '';
        var warn = v.gap < 1 ? ' ⚠️' : '';
        return esc(a) + ' ' + (v.mom10 >= 0 ? '+' : '') + v.mom10 + '%→'
          + (v.th >= 0 ? '+' : '') + v.th + '%(差' + v.gap.toFixed(2) + 'pp' + warn
          + (v.trigger_price ? '/触发¥' + v.trigger_price : '') + ')';
      }).filter(Boolean).join(' · ')
    + '</div>';
  var el = document.getElementById('mine-ret');
  if (el && DATA.mine.initial_cash){
    el.innerHTML = fmtPct((eq / DATA.mine.initial_cash - 1) * 100);
  }
  var eqEl = document.getElementById('mine-eq');
  if (eqEl) eqEl.textContent = eq.toLocaleString('zh-CN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  // 外盘: QQQ / USDCNY
  var fxEl = document.getElementById('fx-line');
  if (fxEl){
    var qq = q['QQQ'], cn = q['USDCNY'];
    if (qq && qq.price && cn && cn.price){
      fxEl.textContent = '外盘: QQQ $' + qq.price + ' (' + (qq.pct >= 0 ? '+' : '') + qq.pct + '%) · USDCNY ' + cn.price
        + ' · QQQ-CNY ≈ ¥' + Math.round(qq.price * cn.price) + ' · ' + (qq.time || '');
    }
  }
}
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}
function _tailOf(nav){
  var lastIdx = -1;
  for (var i = nav.length - 1; i >= 0; i--){
    if (nav[i] !== null && nav[i] !== undefined){ lastIdx = i; break; }
  }
  return lastIdx;
}
function updateChartLive(q, eq){
  if (!chartInst) return;
  var nowD = todayStr();
  var xdata = DATA.dates.slice();
  var tradeDay = !!(q && q.trade_day);            // 服务端判定: 今天是否已开盘的A股交易日
  var xAppend = (xdata[xdata.length - 1] !== nowD);
  if (!tradeDay && xAppend) return;               // 非交易日/开盘前: 不画新一天的点, 保持上一交易日收盘
  var upd = [];
  // 1) 我的实盘
  if (eq !== null && eq !== undefined && DATA.mine.initial_cash){
    var mineNav = DATA.nav.slice();
    var liveNav = Math.round(eq / DATA.mine.initial_cash * 10000) / 10000;
    if (xAppend) mineNav.push(liveNav); else mineNav[mineNav.length - 1] = liveNav;
    upd.push({ id: 'mine', data: mineNav });
  }
  // 2) 策略(实时): 尾点 = 昨净值 × 持仓现价/昨收
  if (DATA.strat && DATA.strat.position && q[DATA.strat.position] && q[DATA.strat.position].prev_close){
    var sq = q[DATA.strat.position];
    var snav = DATA.strat.nav.slice();
    var sTail = _tailOf(snav);
    var sBase = xAppend ? sTail : sTail - 1;   // 昨天收盘净值
    if (sBase >= 0 && snav[sBase]){
      var sLive = Math.round(snav[sBase] * (sq.price / sq.prev_close) * 10000) / 10000;
      if (xAppend) snav.push(sLive); else snav[sTail] = sLive;
      upd.push({ id: 'strat', data: snav });
    }
  }
  // 3) 基准指数: 尾点 = 昨收净值 × 现价/昨收
  (DATA.benchmarks || []).forEach(function(b){
    var bq = q[b.name];
    if (!bq || !bq.prev_close) return;
    var nav = b.nav.slice();
    var tail = _tailOf(nav);
    var base = xAppend ? tail : tail - 1;
    if (base < 0 || !nav[base]) return;
    var live = Math.round(nav[base] * (bq.price / bq.prev_close) * 10000) / 10000;
    if (xAppend) nav.push(live); else nav[tail] = live;
    upd.push({ id: 'idx_' + b.name, data: nav });
  });
  // 4) 组合曲线: 尾点 = 昨净值 × 持仓现价/昨收
  (DATA.combos || []).forEach(function(c, i){
    if (!c.position) return;
    var cq = q[c.position];
    if (!cq || !cq.prev_close) return;
    var nav = c.nav.slice();
    var tail = _tailOf(nav);
    var base = xAppend ? tail : tail - 1;
    if (base < 0 || !nav[base]) return;
    var live = Math.round(nav[base] * (cq.price / cq.prev_close) * 10000) / 10000;
    if (xAppend) nav.push(live); else nav[tail] = live;
    upd.push({ id: 'combo_' + i, data: nav });
  });
  if (xAppend) xdata.push(nowD);
  chartInst.setOption({ xAxis: { data: xdata }, series: upd });
}
function refreshLive(){
  var assets = liveAssets();
  if (!assets.length) return;
  fetch('/mytrack/' + KEY + '/live?assets=' + encodeURIComponent(assets.join(',')), {cache: 'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      var q = j.quotes || {};
      var eq = computeEq(q);
      renderOpenBox(q, eq);
      updateChartLive(q, eq);
    })
    .catch(function(){});
}
function msg(t, c){ var el = document.getElementById('save-msg'); if (el){ el.textContent = t; el.style.color = c; } }

function drawChart(){
  var series = [
    { id: 'mine', name: '我的实盘', type: 'line', data: DATA.nav, showSymbol: false,
      lineStyle: { color: '#e94560', width: 2 }, itemStyle: { color: '#e94560' } },
    { id: 'buys', name: '买点', type: 'scatter', symbol: 'triangle', symbolSize: 11,
      itemStyle: { color: '#4caf50' },
      data: DATA.marks.filter(function(m){ return m.kind === 'buy'; }).map(function(m){ return [m.date, m.nav]; }) },
    { id: 'sells', name: '卖点', type: 'scatter', symbol: 'triangle', symbolRotate: 180, symbolSize: 11,
      itemStyle: { color: '#f44336' },
      data: DATA.marks.filter(function(m){ return m.kind === 'sell'; }).map(function(m){ return [m.date, m.nav]; }) }
  ];
  var xdata = DATA.dates;
  if (DATA.strat){
    // 策略日期与我的一致则直接并列, 否则按日期对齐
    var same = DATA.strat.dates.length === DATA.dates.length;
    series.push({ id: 'strat', name: '策略(实时)', type: 'line', showSymbol: false,
      lineStyle: { color: '#64b5f6', width: 2, type: 'dashed' }, itemStyle: { color: '#64b5f6' },
      data: same ? DATA.strat.nav : alignStrat() });
  }
  var IDX_COLORS = ['#ffb74d', '#4dd0e1', '#ba68c8', '#aed581'];
  (DATA.benchmarks || []).forEach(function(b, i){
    series.push({ id: 'idx_' + b.name, name: b.name, type: 'line', showSymbol: false,
      lineStyle: { color: IDX_COLORS[i % IDX_COLORS.length], width: 1.4 },
      itemStyle: { color: IDX_COLORS[i % IDX_COLORS.length] },
      data: b.nav });
  });
  var COMBO_COLORS = ['#f06292', '#26a69a', '#7e57c2', '#d4e157', '#ef6c00',
                      '#5c6bc0', '#00acc1', '#9ccc65', '#ec407a', '#8d6e63'];
  (DATA.combos || []).forEach(function(c, i){
    var idx = {}; c.dates.forEach(function(d, j){ idx[d] = c.nav[j]; });
    series.push({ id: 'combo_' + i, name: c.name, type: 'line', showSymbol: false,
      lineStyle: { color: COMBO_COLORS[i % COMBO_COLORS.length], width: 1.6, type: 'dotted' },
      itemStyle: { color: COMBO_COLORS[i % COMBO_COLORS.length] },
      data: DATA.dates.map(function(d){ return idx[d] === undefined ? null : idx[d]; }) });
  });
  function alignStrat(){
    var idx = {}; DATA.strat.dates.forEach(function(d, i){ idx[d] = DATA.strat.nav[i]; });
    return DATA.dates.map(function(d){ return idx[d] === undefined ? null : idx[d]; });
  }
  // 默认只显示: 我的实盘 / 策略(实时) / 上证指数 / 创业板指数, 其余在图例手动开
  var sel = {};
  series.forEach(function(s){ sel[s.name] = false; });
  ['我的实盘', '策略(实时)', '上证指数', '创业板指数'].forEach(function(n){
    if (sel.hasOwnProperty(n)) sel[n] = true;
  });
  var c = echarts.init(document.getElementById('nav-chart'));
  chartInst = c;
  c.setOption({
    backgroundColor: 'transparent', animation: false,
    tooltip: { trigger: 'axis', backgroundColor: 'rgba(20,24,36,.95)', borderColor: '#2a3142', textStyle: { color: '#e8eaf0' } },
    legend: { top: 0, textStyle: { color: '#8b92a8' }, selected: sel },
    grid: { left: 52, right: 24, top: 34, bottom: 60 },
    xAxis: { type: 'category', data: xdata, axisLine: { lineStyle: { color: '#2a3142' } }, axisLabel: { color: '#8b92a8' } },
    yAxis: { type: 'value', name: '净值', splitLine: { lineStyle: { color: 'rgba(42,49,66,.6)' } }, axisLabel: { color: '#8b92a8' }, scale: true },
    dataZoom: [{ type: 'inside' }, { type: 'slider', height: 18, bottom: 8,
      borderColor: '#2a3142', backgroundColor: 'rgba(20,24,36,.6)', textStyle: { color: '#8b92a8' } }],
    series: series
  });
  window.addEventListener('resize', function(){ c.resize(); });
}
renderMain();
// 持仓分钟级实时刷新（60s 轮询，收盘后腾讯返回最后收盘价）
if (!DATA.empty && DATA.mine && liveAssets().length){
  refreshLive();
  setInterval(refreshLive, 60000);
}
</script>
