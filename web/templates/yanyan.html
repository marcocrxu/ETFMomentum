<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yanyan 策略回测 — 体制层+动量层</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <div class="page-wrapper">
    <header class="page-header">
      <h1>🛡️ yanyan 策略回测</h1>
      <p class="subtitle">体制层(沪深300牛熊开关) + 动量层(score = MOM20/VOL20 轮动) · 11 标的池 · 备注 yanyan</p>
    </header>

    <nav class="page-nav">
      <a href="/">📊 回测</a>
      <a href="/analysis">🔬 策略分析</a>
      <a href="/yanyan" class="active">🛡️ yanyan</a>
      <a href="/leaderboard">🏆 打榜</a>
    </nav>

    <section class="card params-card">
      <div class="card-header"><h2>⚙️ 策略参数</h2></div>
      <div class="param-grid">
        <div class="param-group" style="grid-column: 1 / -1;">
          <label class="group-label">标的池 (点击勾选, 货币为固定空仓停靠不参与排名; 沪深300 兼作牛熊指标)</label>
          <div class="etf-chips" id="yanyan-chips">
            <!-- chips injected by JS -->
          </div>
        </div>

        <div class="param-group">
          <label class="group-label" title="沪深300 现价低于 MA(N) 判定熊市, A股池禁止持仓, 只允许跨境+黄金">牛熊均线周期</label>
          <input id="regime_ma" type="number" value="200" min="20">
        </div>
        <div class="param-group">
          <label class="group-label" title="挑战者 MOM20 须超持仓此幅度才切换, 防频繁换手">轮动缓冲 %</label>
          <input id="switch_buffer" type="number" step="0.5" value="2.0">
        </div>
        <div class="param-group">
          <label class="group-label" title="持仓 MOM20 超过此值进入过热态: 离场收紧为 MOM5<0">过热门槛 %</label>
          <input id="overheat_mom" type="number" step="5" value="40">
        </div>
        <div class="param-group">
          <label class="group-label" title="过热标的再进场须 MOM5 > Q 确认">过热再进场 Q %</label>
          <input id="overheat_q" type="number" step="0.5" value="3.0">
        </div>
        <div class="param-group">
          <label class="group-label" title="空仓停靠 511880 银华日利, 收益计入净值(进出各计费)">空仓停靠货基</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="cash_park" checked>
              <span class="track"></span>
            </label>
          </div>
        </div>
        <div class="param-group">
          <label class="group-label" title="空仓入场也要求 MOM20 > 缓冲值 (原文'且MOM20>0'的防贴线强化; 关闭=仅要求>0)">空仓入场缓冲</label>
          <div class="toggle-row">
            <label class="toggle">
              <input type="checkbox" id="cash_skip_buffer" checked>
              <span class="track"></span>
            </label>
          </div>
        </div>
        <div class="param-group">
          <label class="group-label">起始日期</label>
          <input id="start_date" type="date" value="2016-07-07">
        </div>
        <div class="param-group">
          <label class="group-label">结束日期</label>
          <input id="end_date" type="date" value="2026-08-12">
        </div>
        <div class="param-group">
          <label class="group-label">手续费 %</label>
          <input id="commission" type="number" step="0.005" value="0.01">
        </div>
        <div class="param-group">
          <label class="group-label">滑点 %</label>
          <input id="slippage" type="number" step="0.01" value="0.0" min="0">
        </div>
      </div>
      <div class="param-actions">
        <button type="button" class="btn btn-primary" id="btn-run">🚀 运行回测</button>
      </div>
      <div class="error-banner" id="error-banner" style="display:none"></div>
    </section>

    <section class="kpi-grid" id="kpi-grid" style="display:none">
      <div class="kpi"><div class="kpi-value" id="kpi-total">--</div><div class="kpi-label">累计收益</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-ann">--</div><div class="kpi-label">年化收益</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-dd">--</div><div class="kpi-label">最大回撤</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-calmar">--</div><div class="kpi-label">Calmar</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-sharpe">--</div><div class="kpi-label">夏普比率</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-vol">--</div><div class="kpi-label">年化波动</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-trades">--</div><div class="kpi-label">交易笔数</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-neg">--</div><div class="kpi-label">亏损年</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-pos" style="font-size:14px">--</div><div class="kpi-label">最后持仓</div></div>
      <div class="kpi"><div class="kpi-value" id="kpi-range" style="font-size:11px">--</div><div class="kpi-label">数据范围</div></div>
    </section>

    <div class="charts-toolbar" id="charts-toolbar" style="display:none">
      <label class="link-toggle">
        <input type="checkbox" id="link-zoom" checked>
        <span>🔗 四图联动缩放</span>
      </label>
    </div>

    <section class="charts-grid" id="charts-grid" style="display:none">
      <div class="card chart-card"><div class="card-header"><h2>📈 净值曲线</h2></div><div class="chart" id="nav-chart"></div></div>
      <div class="card chart-card"><div class="card-header"><h2>📉 回撤曲线</h2></div><div class="chart" id="drawdown-chart"></div></div>
      <div class="card chart-card"><div class="card-header"><h2>📅 年度收益</h2></div><div class="chart" id="yearly-chart"></div></div>
      <div class="card chart-card"><div class="card-header"><h2>🔄 持仓轮动</h2></div><div class="chart" id="position-chart"></div></div>
    </section>

    <section class="card table-card" id="table-card" style="display:none">
      <div class="card-header"><h2>📋 决策记录</h2></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>日期</th><th>决策</th><th>成交价</th><th>收益</th><th>净值</th><th>持有天</th><th>原因</th></tr></thead>
          <tbody id="trades-body"></tbody>
        </table>
      </div>
    </section>
  </div>

  <div class="loading-overlay" id="loading" style="display:none">
    <div class="loading-box"><div class="spinner"></div><p id="loading-text">回测计算中...</p></div>
  </div>

  <script src="{{ url_for('static', filename='lib/echarts.min.js', v='20260821') }}"></script>
  <script src="{{ url_for('static', filename='js/charts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/yanyan.js') }}"></script>
</body>
</html>
