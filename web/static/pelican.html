<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦤 鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { margin: 0; padding: 0; background: #0f172a; min-height: 100vh;
               display: flex; flex-direction: column; align-items: center; justify-content: center;
               font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
  .stage { width: min(960px, 96vw); }
  svg { width: 100%; height: auto; display: block; border-radius: 18px;
        box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .caption { color: #94a3b8; text-align: center; margin: 14px 0 0; font-size: 14px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕在骑自行车的循环动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="900" height="400" fill="url(#sky)"/>

  <!-- 太阳（光芒缓慢旋转） -->
  <g>
    <g stroke="#fbbf24" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 770 90" to="360 770 90" dur="40s" repeatCount="indefinite"/>
      <line x1="770" y1="22"  x2="770" y2="40"/>
      <line x1="770" y1="140" x2="770" y2="158"/>
      <line x1="702" y1="90"  x2="720" y2="90"/>
      <line x1="820" y1="90"  x2="838" y2="90"/>
      <line x1="722" y1="42"  x2="735" y2="55"/>
      <line x1="805" y1="125" x2="818" y2="138"/>
      <line x1="818" y1="42"  x2="805" y2="55"/>
      <line x1="735" y1="125" x2="722" y2="138"/>
    </g>
    <circle cx="770" cy="90" r="34" fill="#fde047" stroke="#fbbf24" stroke-width="4"/>
  </g>

  <!-- 云朵（不同速度横移循环） -->
  <g fill="#ffffff" opacity="0.95">
    <g>
      <animateTransform attributeName="transform" type="translate" from="950 0" to="-260 0" dur="55s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="80" rx="46" ry="22"/><ellipse cx="34" cy="68" rx="34" ry="20"/><ellipse cx="-34" cy="70" rx="30" ry="17"/>
    </g>
    <g opacity="0.85">
      <animateTransform attributeName="transform" type="translate" from="1050 0" to="-260 0" dur="75s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="150" rx="40" ry="18"/><ellipse cx="30" cy="140" rx="28" ry="16"/><ellipse cx="-28" cy="142" rx="24" ry="14"/>
    </g>
    <g opacity="0.75">
      <animateTransform attributeName="transform" type="translate" from="1180 0" to="-300 0" dur="95s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="45" rx="52" ry="20"/><ellipse cx="38" cy="36" rx="32" ry="17"/><ellipse cx="-36" cy="38" rx="28" ry="14"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M -20 400 Q 120 300 260 400 Z" fill="#86efac"/>
  <path d="M 180 400 Q 360 270 540 400 Z" fill="#4ade80"/>
  <path d="M 480 400 Q 680 290 920 400 Z" fill="#22c55e" opacity="0.9"/>

  <!-- 标题 -->
  <text x="450" y="52" text-anchor="middle" font-size="30" font-weight="bold" fill="#0c4a6e" opacity="0.85">鹈鹕骑车去海边 🌊</text>

  <!-- 路面 -->
  <rect x="0" y="400" width="900" height="100" fill="url(#road)"/>
  <rect x="0" y="400" width="900" height="6" fill="#475569"/>
  <!-- 路面虚线（向左滚动，制造前进感） -->
  <g fill="#f8fafc">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.9s" repeatCount="indefinite"/>
    <rect x="0" y="446" width="55" height="8" rx="4"/><rect x="100" y="446" width="55" height="8" rx="4"/>
    <rect x="200" y="446" width="55" height="8" rx="4"/><rect x="300" y="446" width="55" height="8" rx="4"/>
    <rect x="400" y="446" width="55" height="8" rx="4"/><rect x="500" y="446" width="55" height="8" rx="4"/>
    <rect x="600" y="446" width="55" height="8" rx="4"/><rect x="700" y="446" width="55" height="8" rx="4"/>
    <rect x="800" y="446" width="55" height="8" rx="4"/><rect x="900" y="446" width="55" height="8" rx="4"/>
    <rect x="1000" y="446" width="55" height="8" rx="4"/>
  </g>
  <!-- 路边小石子（滚动） -->
  <g fill="#475569" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="1.8s" repeatCount="indefinite"/>
    <circle cx="40" cy="480" r="4"/><circle cx="240" cy="470" r="3"/><circle cx="440" cy="482" r="4"/>
    <circle cx="640" cy="472" r="3"/><circle cx="840" cy="480" r="4"/><circle cx="1040" cy="470" r="3"/>
  </g>

  <!-- ======= 自行车 + 鹈鹕（整体轻微上下颠簸） ======= -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -4; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- 后轮 -->
    <g>
      <circle cx="300" cy="340" r="60" fill="none" stroke="#1e293b" stroke-width="10"/>
      <circle cx="300" cy="340" r="48" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <g stroke="#94a3b8" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 300 340" to="360 300 340" dur="1.2s" repeatCount="indefinite"/>
        <line x1="300" y1="294" x2="300" y2="386"/>
        <line x1="260" y1="317" x2="340" y2="363"/>
        <line x1="260" y1="363" x2="340" y2="317"/>
      </g>
      <circle cx="300" cy="340" r="7" fill="#334155"/>
    </g>

    <!-- 前轮 -->
    <g>
      <circle cx="560" cy="340" r="60" fill="none" stroke="#1e293b" stroke-width="10"/>
      <circle cx="560" cy="340" r="48" fill="none" stroke="#cbd5e1" stroke-width="3"/>
      <g stroke="#94a3b8" stroke-width="3">
        <animateTransform attributeName="transform" type="rotate" from="0 560 340" to="360 560 340" dur="1.2s" repeatCount="indefinite"/>
        <line x1="560" y1="294" x2="560" y2="386"/>
        <line x1="520" y1="317" x2="600" y2="363"/>
        <line x1="520" y1="363" x2="600" y2="317"/>
      </g>
      <circle cx="560" cy="340" r="7" fill="#334155"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="300" y1="340" x2="430" y2="330"/>   <!-- 后下叉 -->
      <line x1="300" y1="340" x2="400" y2="250"/>   <!-- 后上叉 -->
      <line x1="430" y1="330" x2="400" y2="250"/>   <!-- 立管 -->
      <line x1="400" y1="250" x2="545" y2="250"/>   <!-- 上管 -->
      <line x1="430" y1="330" x2="545" y2="250"/>   <!-- 下管 -->
      <line x1="545" y1="250" x2="560" y2="340"/>   <!-- 前叉 -->
      <line x1="545" y1="250" x2="568" y2="232"/>   <!-- 把立 -->
    </g>
    <!-- 车把 + 握把 -->
    <path d="M 568 232 Q 590 226 592 244" stroke="#334155" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="592" cy="246" r="6" fill="#0f172a"/>
    <!-- 车座 -->
    <rect x="378" y="238" width="46" height="13" rx="6" fill="#334155"/>

    <!-- 牙盘曲柄 + 脚踏（两只相差 180°） -->
    <line x1="430" y1="330" x2="452" y2="330" stroke="#1e293b" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" values="452;445.6;430;414.4;408;414.4;430;445.6;452" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="330;345.6;352;345.6;330;314.4;308;314.4;330" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="430" y1="330" x2="408" y2="330" stroke="#1e293b" stroke-width="6" stroke-linecap="round">
      <animate attributeName="x2" values="408;414.4;430;445.6;452;445.6;430;414.4;408" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="330;314.4;308;314.4;330;345.6;352;345.6;330" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <circle cx="430" cy="330" r="10" fill="#475569" stroke="#1e293b" stroke-width="3"/>

    <!-- 鹈鹕的腿（远端）+ 脚爪踩脚踏 -->
    <line x1="382" y1="242" x2="408" y2="330" stroke="#64748b" stroke-width="7" stroke-linecap="round">
      <animate attributeName="x2" values="408;414.4;430;445.6;452;445.6;430;414.4;408" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="330;314.4;308;314.4;330;345.6;352;345.6;330" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <circle cx="408" cy="330" r="6" fill="#475569">
      <animate attributeName="cx" values="408;414.4;430;445.6;452;445.6;430;414.4;408" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="330;314.4;308;314.4;330;345.6;352;345.6;330" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>

    <!-- ======= 鹈鹕身体 ======= -->
    <g>
      <!-- 尾巴 -->
      <path d="M 336 198 L 302 188 L 314 216 Z" fill="#cbd5e1"/>
      <!-- 身体 -->
      <ellipse cx="392" cy="212" rx="60" ry="37" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <!-- 翅膀（扇动） -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 378 196; -16 378 196; 0 378 196" dur="0.6s" repeatCount="indefinite"/>
        <path d="M 378 196 Q 330 210 306 246 Q 356 252 398 228 Q 392 208 378 196 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
        <path d="M 316 240 Q 350 244 384 228" stroke="#cbd5e1" stroke-width="2" fill="none"/>
      </g>
      <!-- 脖子 -->
      <path d="M 428 196 Q 444 176 452 164" stroke="#f8fafc" stroke-width="22" stroke-linecap="round" fill="none"/>
      <!-- 头 -->
      <circle cx="462" cy="156" r="21" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
      <!-- 头顶小冠羽 -->
      <path d="M 446 140 Q 436 128 444 122 Q 450 132 452 138 Z" fill="#cbd5e1"/>
      <!-- 头盔 -->
      <path d="M 441 150 A 22 22 0 0 1 484 148 L 484 143 A 25 25 0 0 0 438 145 Z" fill="#ef4444"/>
      <rect x="439" y="146" width="47" height="6" rx="3" fill="#dc2626"/>
      <!-- 眼睛 -->
      <circle cx="470" cy="150" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
      <circle cx="471.5" cy="150" r="2.4" fill="#0f172a"/>
      <!-- 长喙（上部） -->
      <path d="M 478 148 L 606 161 L 478 163 Z" fill="#fb923c"/>
      <!-- 喉囊 -->
      <path d="M 478 163 C 524 206 566 204 606 163 C 566 176 524 176 478 169 Z" fill="#fed7aa" stroke="#fdba74" stroke-width="2"/>
      <!-- 喙尖 -->
      <circle cx="606" cy="162" r="4" fill="#ea580c"/>
    </g>

    <!-- 鹈鹕的腿（近端）+ 脚爪踩脚踏 -->
    <line x1="398" y1="238" x2="452" y2="330" stroke="#94a3b8" stroke-width="7" stroke-linecap="round">
      <animate attributeName="x2" values="452;445.6;430;414.4;408;414.4;430;445.6;452" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="330;345.6;352;345.6;330;314.4;308;314.4;330" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <circle cx="452" cy="330" r="6" fill="#64748b">
      <animate attributeName="cx" values="452;445.6;430;414.4;408;414.4;430;445.6;452" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="330;345.6;352;345.6;330;314.4;308;314.4;330" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 前景草叶（快速滚动，增强速度感） -->
  <g stroke="#16a34a" stroke-width="4" stroke-linecap="round" fill="none">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-300 0" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 60 500 Q 64 478 58 466"/><path d="M 72 500 Q 78 480 74 470"/>
    <path d="M 360 500 Q 364 478 358 466"/><path d="M 372 500 Q 378 480 374 470"/>
    <path d="M 660 500 Q 664 478 658 466"/><path d="M 672 500 Q 678 480 674 470"/>
    <path d="M 960 500 Q 964 478 958 466"/><path d="M 972 500 Q 978 480 974 470"/>
  </g>
</svg>
<p class="caption">🦤 纯 SVG + SMIL 动画 · 无 JS 无依赖 · 循环播放</p>
</div>
</body>
</html>
